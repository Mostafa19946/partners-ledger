  var natCmpAr = function(a,b){ return String(a).localeCompare(String(b),'ar',{numeric:true}); };
  // difference cell: sold above the inventory price (+), below it (-), or equal (—)
  function priceDiffCell(v){
    v = Number(v)||0;
    if(Math.abs(v)<0.005) return '<td class="amt" style="color:var(--ink-soft);">—</td>';
    return '<td class="amt '+(v>0?'credit':'debit')+'">'+(v>0?'+':'')+money(v)+'</td>';
  }
  function salesGroupedReportHtml(sales, collectedBySale){
    if(!sales.length) return '';
    var rows = sales.map(function(s){
      var value = Number(s.sale_amount)||0, qty = Number(s.quantity)||1, collected = collectedBySale[s.id]||0;
      var inv = (Number(s.item_unit_price)||0) * qty;                       // what the inventory says this sale should be worth
      return { building:(s.item_building||s.building_no||'').trim()||'بدون عمارة', type:(s.item_unit||'').trim()||'غير محدد',
               unit:s.item_name, customer:s.customer_name||'—', value:value, inv:inv, diff:value-inv, collected:collected, remaining:value-collected };
    });
    var sum = function(list){ return list.reduce(function(t,r){ return {n:t.n+1, value:t.value+r.value, inv:t.inv+r.inv, diff:t.diff+r.diff, collected:t.collected+r.collected, remaining:t.remaining+r.remaining}; }, {n:0,value:0,inv:0,diff:0,collected:0,remaining:0}); };
    var totalRow = function(label, t, cls){
      return '<tr class="'+cls+'"><td colspan="2">'+label+' <span class="mono">('+t.n+' وحدة)</span></td><td class="amt">'+money(t.value)+'</td><td class="amt">'+money(t.inv)+'</td>'+priceDiffCell(t.diff)+
        '<td class="amt">'+money(t.collected)+'</td><td class="amt">'+money(t.remaining)+'</td></tr>';
    };
    var group = function(list, key){ var o = {}; list.forEach(function(r){ (o[r[key]] = o[r[key]] || []).push(r); }); return o; };
    var body = '', byB = group(rows,'building');
    Object.keys(byB).sort(natCmpAr).forEach(function(b){
      body += '<tr class="ea-g0"><td colspan="7">العمارة: '+escapeHtml(b)+'</td></tr>';
      var byT = group(byB[b],'type');
      Object.keys(byT).sort(natCmpAr).forEach(function(t){
        body += '<tr class="ea-g2"><td colspan="7" style="padding-right:26px;">النوع: '+escapeHtml(t)+'</td></tr>';
        byT[t].sort(function(x,y){ return natCmpAr(x.unit,y.unit); }).forEach(function(r){
          body += '<tr><td style="padding-right:44px;">'+escapeHtml(r.unit)+'</td><td>'+escapeHtml(r.customer)+'</td><td class="amt">'+money(r.value)+'</td><td class="amt">'+money(r.inv)+'</td>'+priceDiffCell(r.diff)+
            '<td class="amt credit">'+money(r.collected)+'</td><td class="amt '+(r.remaining>0.001?'debit':'')+'">'+money(r.remaining)+'</td></tr>';
        });
        body += totalRow('إجمالي '+escapeHtml(t)+' في '+escapeHtml(b), sum(byT[t]), 'ea-g3');
      });
      body += totalRow('إجمالي العمارة '+escapeHtml(b), sum(byB[b]), 'ea-g1');
    });
    var all = sum(rows), byTypeAll = group(rows,'type');
    var typeRows = Object.keys(byTypeAll).sort(natCmpAr).map(function(t){
      var x = sum(byTypeAll[t]);
      return '<tr><td>'+escapeHtml(t)+'</td><td class="mono">'+x.n+'</td><td class="amt">'+money(x.value)+'</td><td class="amt">'+money(x.inv)+'</td>'+priceDiffCell(x.diff)+
        '<td class="amt credit">'+money(x.collected)+'</td><td class="amt '+(x.remaining>0.001?'debit':'')+'">'+money(x.remaining)+'</td></tr>';
    }).join('');
    var mismatches = rows.filter(function(r){ return Math.abs(r.diff)>=0.005; }).length;
    return '<div class="page-head" style="margin-top:8px;"><h2 style="font-size:18px;">تقرير المبيعات حسب العمارة والنوع</h2></div>'+
    '<div class="grid-stats">'+
      '<div class="stat"><div class="label">عدد الوحدات المباعة</div><div class="val teal">'+all.n+'</div></div>'+
      '<div class="stat"><div class="label">إجمالي قيمة الوحدات (سعر البيع)</div><div class="val">'+money(all.value)+'</div></div>'+
      '<div class="stat"><div class="label">إجمالي المحصل من العملاء</div><div class="val credit">'+money(all.collected)+'</div></div>'+
      '<div class="stat"><div class="label">إجمالي المتبقي لدى العملاء</div><div class="val '+(all.remaining>0.001?'debit':'credit')+'">'+money(all.remaining)+'</div></div>'+
      '<div class="stat"><div class="label">وحدات سعر بيعها مختلف عن سعر المخزون</div><div class="val '+(mismatches?'debit':'credit')+'">'+mismatches+'</div></div>'+
    '</div>'+
    '<div class="panel"><div class="panel-head"><h3>المبيعات مرتبة بالعمارة ثم النوع، بإجمالي كل نوع وكل عمارة</h3></div><div class="panel-body" style="padding:0;overflow-x:auto;">'+
      '<table><thead><tr><th>الوحدة</th><th>العميل</th><th>سعر البيع</th><th>سعر المخزون</th><th>الفرق</th><th>المحصل من العميل</th><th>المتبقي لدى العميل</th></tr></thead><tbody>'+body+
      totalRow('الإجمالي الكلي', all, 'ea-grand')+'</tbody></table>'+
    '</div></div>'+
    '<div class="panel"><div class="panel-head"><h3>الإجمالي حسب النوع (كل العمارات)</h3></div><div class="panel-body" style="padding:0;overflow-x:auto;">'+
      '<table><thead><tr><th>النوع</th><th>عدد الوحدات</th><th>سعر البيع</th><th>سعر المخزون</th><th>الفرق</th><th>المحصل من العملاء</th><th>المتبقي</th></tr></thead><tbody>'+typeRows+
      '<tr class="ea-grand"><td>الإجمالي الكلي</td><td class="mono">'+all.n+'</td><td class="amt">'+money(all.value)+'</td><td class="amt">'+money(all.inv)+'</td>'+priceDiffCell(all.diff)+'<td class="amt">'+money(all.collected)+'</td><td class="amt">'+money(all.remaining)+'</td></tr></tbody></table>'+
    '</div></div>';
  }

  // Inventory sorted by building then type, with a count / value / area subtotal for each type, each building and for everything.
  // For sold units it also shows the price they were sold at and the difference from the inventory price.
  function inventoryGroupedReportHtml(items, sales){
    if(!items.length) return '';
    var sold = {};
    sales.forEach(function(s){ var x = sold[s.item_id] || (sold[s.item_id] = {qty:0, value:0}); x.qty += Number(s.quantity)||0; x.value += Number(s.sale_amount)||0; });
    var rows = items.map(function(it){
      var sd = sold[it.id], qtyIn = Number(it.quantity_in)||0, invVal = (Number(it.unit_price)||0) * qtyIn;
      var soldInvVal = sd ? (Number(it.unit_price)||0) * sd.qty : 0;
      return { building:(it.building||'').trim()||'بدون عمارة', type:(it.unit||'').trim()||'غير محدد', name:it.name, status:(it.status||'').trim()||'بدون حالة',
               invVal:invVal, saleVal:sd?sd.value:0, soldInvVal:soldInvVal, isSold:!!sd, net:Number(it.net_area)||0, garden:Number(it.garden_area)||0,
               left: qtyIn - (sd?sd.qty:0) };
    });
    var sum = function(list){ return list.reduce(function(t,r){ return {n:t.n+1, inv:t.inv+r.invVal, sale:t.sale+r.saleVal, diff:t.diff+(r.isSold?r.saleVal-r.soldInvVal:0), net:t.net+r.net, garden:t.garden+r.garden, left:t.left+r.left}; }, {n:0,inv:0,sale:0,diff:0,net:0,garden:0,left:0}); };
    var totalRow = function(label, t, cls){
      return '<tr class="'+cls+'"><td colspan="2">'+label+' <span class="mono">('+t.n+' وحدة)</span></td><td class="amt">'+money(t.inv)+'</td><td class="amt">'+(t.sale?money(t.sale):'—')+'</td>'+priceDiffCell(t.diff)+
        '<td class="mono">'+t.net.toLocaleString('en-US',{maximumFractionDigits:2})+'</td><td class="mono">'+t.garden.toLocaleString('en-US',{maximumFractionDigits:2})+'</td><td class="mono">'+t.left+'</td></tr>';
    };
    var group = function(list, key){ var o = {}; list.forEach(function(r){ (o[r[key]] = o[r[key]] || []).push(r); }); return o; };
    var body = '', byB = group(rows,'building');
    Object.keys(byB).sort(natCmpAr).forEach(function(b){
      body += '<tr class="ea-g0"><td colspan="8">العمارة: '+escapeHtml(b)+'</td></tr>';
      var byT = group(byB[b],'type');
      Object.keys(byT).sort(natCmpAr).forEach(function(t){
        body += '<tr class="ea-g2"><td colspan="8" style="padding-right:26px;">النوع: '+escapeHtml(t)+'</td></tr>';
        byT[t].sort(function(x,y){ return natCmpAr(x.name,y.name); }).forEach(function(r){
          body += '<tr><td style="padding-right:44px;">'+escapeHtml(r.name)+'</td><td><span class="tag cat">'+escapeHtml(r.status)+'</span></td><td class="amt">'+money(r.invVal)+'</td>'+
            '<td class="amt">'+(r.isSold?money(r.saleVal):'—')+'</td>'+(r.isSold?priceDiffCell(r.saleVal-r.soldInvVal):'<td class="amt" style="color:var(--ink-soft);">—</td>')+
            '<td class="mono">'+(r.net||'—')+'</td><td class="mono">'+(r.garden||'—')+'</td><td class="mono">'+r.left+'</td></tr>';
        });
        body += totalRow('إجمالي '+escapeHtml(t)+' في '+escapeHtml(b), sum(byT[t]), 'ea-g3');
      });
      body += totalRow('إجمالي العمارة '+escapeHtml(b), sum(byB[b]), 'ea-g1');
    });
    var all = sum(rows);
    var cnt = function(st){ return rows.filter(function(r){ return r.status===st; }).length; };
    var known = ['متاح','محجوز','مباع'], other = rows.filter(function(r){ return known.indexOf(r.status)<0; }).length;
    var availVal = rows.filter(function(r){ return r.status==='متاح'; }).reduce(function(t,r){ return t+r.invVal; },0);
    var byTypeAll = group(rows,'type');
    var typeRows = Object.keys(byTypeAll).sort(natCmpAr).map(function(t){
      var l = byTypeAll[t], x = sum(l), c = function(st){ return l.filter(function(r){ return r.status===st; }).length; };
      return '<tr><td>'+escapeHtml(t)+'</td><td class="mono">'+x.n+'</td><td class="mono">'+c('متاح')+'</td><td class="mono">'+c('محجوز')+'</td><td class="mono">'+c('مباع')+'</td><td class="amt">'+money(x.inv)+'</td></tr>';
    }).join('');
    return '<div class="page-head" style="margin-top:8px;"><h2 style="font-size:18px;">تقرير المخزون حسب العمارة والنوع</h2></div>'+
    '<div class="grid-stats">'+
      '<div class="stat"><div class="label">إجمالي عدد الوحدات</div><div class="val teal">'+all.n+'</div></div>'+
      '<div class="stat"><div class="label">متاح</div><div class="val credit">'+cnt('متاح')+'</div></div>'+
      '<div class="stat"><div class="label">محجوز</div><div class="val">'+cnt('محجوز')+'</div></div>'+
      '<div class="stat"><div class="label">مباع</div><div class="val">'+cnt('مباع')+'</div></div>'+
      (other ? '<div class="stat"><div class="label">حالات أخرى</div><div class="val">'+other+'</div></div>' : '')+
      '<div class="stat"><div class="label">إجمالي قيمة المخزون</div><div class="val teal">'+money(all.inv)+'</div></div>'+
      '<div class="stat"><div class="label">قيمة المتاح للبيع</div><div class="val credit">'+money(availVal)+'</div></div>'+
    '</div>'+
    '<div class="panel"><div class="panel-head"><h3>المخزون مرتب بالعمارة ثم النوع، بإجمالي كل نوع وكل عمارة</h3></div><div class="panel-body" style="padding:0;overflow-x:auto;">'+
      '<table><thead><tr><th>الوحدة</th><th>الحالة</th><th>سعر المخزون</th><th>سعر البيع</th><th>الفرق</th><th>مساحة الوحدة</th><th>مساحة الجاردن</th><th>المتبقي</th></tr></thead><tbody>'+body+
      totalRow('الإجمالي الكلي', all, 'ea-grand')+'</tbody></table>'+
    '</div></div>'+
    '<div class="panel"><div class="panel-head"><h3>إجمالي المخزون حسب النوع</h3></div><div class="panel-body" style="padding:0;overflow-x:auto;">'+
      '<table><thead><tr><th>النوع</th><th>عدد الوحدات</th><th>متاح</th><th>محجوز</th><th>مباع</th><th>قيمة المخزون</th></tr></thead><tbody>'+typeRows+
      '<tr class="ea-grand"><td>الإجمالي الكلي</td><td class="mono">'+all.n+'</td><td class="mono">'+cnt('متاح')+'</td><td class="mono">'+cnt('محجوز')+'</td><td class="mono">'+cnt('مباع')+'</td><td class="amt">'+money(all.inv)+'</td></tr></tbody></table>'+
    '</div></div>';
  }

  // Admin only: units whose sale price differs from the inventory price, each with a one-click fix that
  // sets the inventory price to the price it was really sold at.
  function priceMismatchHtml(sales){
    var rows = sales.map(function(s){
      var qty = Number(s.quantity)||1, sale = (Number(s.sale_amount)||0)/qty, inv = Number(s.item_unit_price)||0;
      return { itemId:s.item_id, unit:s.item_name, customer:s.customer_name||'—', inv:inv, sale:sale, diff:sale-inv };
    }).filter(function(r){ return Math.abs(r.diff)>=0.005; }).sort(function(a,b){ return natCmpAr(a.unit,b.unit); });
    if(!rows.length) return '<div class="muted-note" style="margin-bottom:12px;">✓ كل الوحدات المباعة سعر بيعها مطابق لسعرها في المخزون.</div>';
    var body = rows.map(function(r){
      return '<tr><td>'+escapeHtml(r.unit)+'</td><td>'+escapeHtml(r.customer)+'</td><td class="amt">'+money(r.inv)+'</td><td class="amt">'+money(r.sale)+'</td>'+priceDiffCell(r.diff)+
        '<td><button class="btn ghost sm" data-sync-price="'+r.itemId+'" type="button">تحديث سعر المخزون</button></td></tr>';
    }).join('');
    return '<div class="panel"><div class="panel-head"><h3>مقارنة الأسعار: المخزون مقابل المبيعات ('+rows.length+' وحدة مختلفة)</h3>'+
      '<button class="btn sm" id="sync-all-prices" type="button" data-count="'+rows.length+'" data-total="'+rows.reduce(function(t,r){ return t+r.diff; },0).toFixed(2)+'">تحديث سعر المخزون لكل الوحدات دي</button></div>'+
      '<div class="panel-body" style="padding:0;overflow-x:auto;"><table><thead><tr><th>الوحدة</th><th>العميل</th><th>سعر المخزون</th><th>سعر البيع</th><th>الفرق</th><th></th></tr></thead><tbody>'+body+'</tbody></table></div></div>'+
      '<div class="muted-note" style="margin-bottom:12px;">التحديث بيخلّي سعر الوحدة في المخزون = السعر اللي اتباعت بيه فعلًا. وحدة اتباعت بأكتر من سعر مبيتغيرش سعرها تلقائي.</div>';
  }

  function pageCustomerAccountsHtml(sales, collectedBySale){
    var byCustomer = {};
    sales.forEach(function(s){
      var key = (s.customer_name||'').trim() || '(بدون اسم عميل)';
      if(!byCustomer[key]) byCustomer[key] = {name:key, sales:[], dues:0, collected:0};
      var collected = collectedBySale[s.id]||0;
      var dues = Number(s.sale_amount) + Number(s.garage_value||0) + Number(s.maintenance_value||0) + Number(s.utilities_value||0);
      byCustomer[key].sales.push(s);
      byCustomer[key].dues += dues;
      byCustomer[key].collected += collected + Number(s.garage_collected||0) + Number(s.maintenance_collected||0) + Number(s.utilities_collected||0);
    });
    var customers = Object.keys(byCustomer).map(function(k){ return byCustomer[k]; })
      .sort(function(a,b){ return a.name.localeCompare(b.name,'ar'); });

    var rows = customers.map(function(cust){
      var remaining = cust.dues - cust.collected;
      var rowId = 'cust-detail-'+cust.name.replace(/[^a-zA-Z0-9\u0600-\u06FF]/g,'_');
      var unitRows = cust.sales.map(function(s){
        var collected = collectedBySale[s.id]||0;
        var rem = Number(s.sale_amount) - collected;
        return '<tr><td>'+escapeHtml(s.building_no||'—')+'</td><td>'+escapeHtml(s.item_name)+'</td>'+
          '<td class="amt">'+money(s.sale_amount)+'</td><td class="amt credit">'+money(collected)+'</td>'+
          '<td class="amt '+(rem>0.001?'debit':'')+'">'+money(rem)+'</td>'+
          '<td><button class="btn ghost sm" data-collect-sale="'+s.id+'" data-remaining="'+rem.toFixed(2)+'">تحصيل</button></td></tr>';
      }).join('');
      return '<tr class="ledger-month-row" data-ledger-toggle="'+rowId+'" style="cursor:pointer;">'+
        '<td><span class="ledger-caret" id="caret-'+rowId+'">▸</span> '+escapeHtml(cust.name)+'</td>'+
        '<td class="mono">'+cust.sales.length+'</td>'+
        '<td class="amt">'+money(cust.dues)+'</td>'+
        '<td class="amt credit">'+money(cust.collected)+'</td>'+
        '<td class="amt '+(remaining>0.001?'debit':'credit')+'">'+money(remaining)+'</td></tr>'+
        '<tr id="'+rowId+'" class="ledger-detail-row" style="display:none;"><td colspan="5" style="padding:10px 14px;background:#faf7ea;">'+
          '<table><thead><tr><th>العمارة</th><th>الوحدة</th><th>قيمة الوحدة</th><th>المحصّل</th><th>المتبقي</th><th></th></tr></thead><tbody>'+unitRows+'</tbody></table>'+
        '</td></tr>';
    }).join('') || '<tr><td colspan="5" class="empty">لا يوجد عملاء مسجلين بعد</td></tr>';

    return '<div class="page-head" style="margin-top:8px;"><h2 style="font-size:18px;">حسابات العملاء</h2></div>'+
    '<div class="panel"><div class="panel-head"><h3>إجمالي المستحقات والمحصّل لكل عميل</h3></div><div class="panel-body" style="padding:0;overflow-x:auto;">'+
      '<table><thead><tr><th>اسم العميل</th><th>عدد الوحدات</th><th>إجمالي المستحقات</th><th>إجمالي المحصّل</th><th>المتبقي</th></tr></thead><tbody>'+rows+'</tbody></table>'+
    '</div></div>'+
    '<div class="muted-note">اضغط على اسم العميل لعرض وحداته، وزرار "تحصيل" بجنب كل وحدة لإضافة دفعة جديدة مباشرة.</div>';
  }

  function pageInventory(){
    if(cache.projects.length===0) return '<div class="page-head"><h2>المخزون والتحصيل</h2></div><div class="panel"><div class="empty">أنشئ مشروعًا أولاً.</div></div>';
    var pid = uiState.invProjectId;
    var pOptions = cache.projects.map(function(p){return '<option value="'+p.id+'"'+(p.id==pid?' selected':'')+'>'+escapeHtml(p.name)+'</option>';}).join('');
    var items = cache.inventoryItems[pid] || [];
    var sales = cache.inventorySales[pid] || [];
    var collections = cache.inventoryCollections[pid] || [];

    var soldByItem = {};
    sales.forEach(function(s){ soldByItem[s.item_id] = (soldByItem[s.item_id]||0) + Number(s.quantity); });
    var collectedBySale = {};
    collections.forEach(function(c){ collectedBySale[c.sale_id] = (collectedBySale[c.sale_id]||0) + Number(c.amount); });

    // ---- Item filters: status + building ----
    var statusValues = Array.from(new Set(items.map(function(it){return it.status;}).filter(Boolean))).sort();
    var buildingValues = Array.from(new Set(items.map(function(it){return it.building;}).filter(Boolean))).sort();
    var statusFilterOptions = '<option value="all">كل الحالات</option>'+statusValues.map(function(s){
      return '<option value="'+escapeHtml(s)+'"'+(uiState.invStatusFilter===s?' selected':'')+'>'+escapeHtml(s)+'</option>';
    }).join('');
    var buildingFilterOptions = '<option value="all">كل العمارات</option>'+buildingValues.map(function(b){
      return '<option value="'+escapeHtml(b)+'"'+(uiState.invBuildingFilter===b?' selected':'')+'>'+escapeHtml(b)+'</option>';
    }).join('');
    var staleSold = items.filter(function(it){
      return soldByItem[it.id]!==undefined && (Number(it.quantity_in) - soldByItem[it.id]) <= 0.000001 && it.status!=='مباع';
    });
    var filteredItems = items.filter(function(it){
      if(uiState.invStatusFilter!=='all' && (it.status||'')!==uiState.invStatusFilter) return false;
      if(uiState.invBuildingFilter!=='all' && (it.building||'')!==uiState.invBuildingFilter) return false;
      return true;
    });

    filteredItems = filteredItems.slice().sort(function(a,b){
      return natCmpAr(a.building||'\uFFFF', b.building||'\uFFFF') || natCmpAr(a.unit||'\uFFFF', b.unit||'\uFFFF') || natCmpAr(a.name, b.name);
    });
    var itemRows = filteredItems.map(function(it){
      var sold = soldByItem[it.id]||0;
      var remainingQty = Number(it.quantity_in) - sold;
      return '<tr>'+selectColCell('inv-items', it.id)+'<td>'+escapeHtml(it.name)+'</td><td>'+escapeHtml(it.unit||'—')+'</td>'+
        '<td><input type="text" class="ei-building" data-item="'+it.id+'" value="'+escapeHtml(it.building||'')+'" style="width:90px;" placeholder="—"></td>'+
        '<td class="mono">'+it.quantity_in+'</td><td class="mono">'+sold+'</td>'+
        '<td class="mono '+(remainingQty<0?'debit':'')+'">'+remainingQty+'</td>'+
        '<td>'+statusSelectHtml('class="ei-status" data-item="'+it.id+'" style="width:100px;"', it.status||'')+'</td>'+
        '<td><input type="number" class="ei-price" data-item="'+it.id+'" value="'+it.unit_price+'" min="0" step="0.01" style="width:110px;"></td>'+
        '<td><input type="number" class="ei-net-area" data-item="'+it.id+'" value="'+(it.net_area!=null?it.net_area:'')+'" min="0" step="0.01" style="width:90px;"></td>'+
        '<td><input type="number" class="ei-garden-area" data-item="'+it.id+'" value="'+(it.garden_area!=null?it.garden_area:'')+'" min="0" step="0.01" style="width:90px;"></td>'+
        '<td><button class="btn ghost sm" data-save-item="'+it.id+'">حفظ</button></td>'+
        '<td><button class="del-x" data-del-item="'+it.id+'">✕</button></td></tr>';
    }).join('') || '<tr><td colspan="12" class="empty">'+(items.length?'لا توجد أصناف تطابق الفلتر المختار':'لا توجد أصناف مخزون لهذا المشروع بعد')+'</td></tr>';

    var editingSaleForOptions = uiState.editingSaleId ? sales.find(function(s){return s.id===uiState.editingSaleId;}) : null;
    var NO_BUILDING = '—';
    var buildingsSet = {};
    items.forEach(function(it){ buildingsSet[it.building || NO_BUILDING] = true; });
    var buildingsList = Object.keys(buildingsSet).sort();
    var selectedBuilding = editingSaleForOptions ? (items.find(function(it){return it.id===editingSaleForOptions.item_id;})||{}).building || NO_BUILDING : (buildingsList[0]||NO_BUILDING);
    var buildingOptions = buildingsList.map(function(b){
      return '<option value="'+escapeHtml(b)+'"'+(b===selectedBuilding?' selected':'')+'>'+escapeHtml(b===NO_BUILDING?'بدون عمارة محددة':b)+'</option>';
    }).join('');
    function itemOptionsForBuilding(building){
      return items.filter(function(it){ return (it.building||NO_BUILDING)===building; }).map(function(it){
        var rem = Number(it.quantity_in)-(soldByItem[it.id]||0);
        var isSel = editingSaleForOptions && editingSaleForOptions.item_id===it.id;
        return '<option value="'+it.id+'" data-price="'+it.unit_price+'" data-building="'+escapeHtml(it.building||'')+'"'+(isSel?' selected':'')+'>'+escapeHtml(it.name)+' ('+rem+' متبقي)</option>';
      }).join('');
    }
    var itemOptions = itemOptionsForBuilding(selectedBuilding);

    var totalSold=0, totalCollected=0;
    var natCmp = function(a,b){ return String(a).localeCompare(String(b),'ar',{numeric:true}); };
    var salesOrdered = sales.slice().sort(function(a,b){
      return natCmp(a.item_building||a.building_no||'\uFFFF', b.item_building||b.building_no||'\uFFFF')
          || natCmp(a.item_unit||'\uFFFF', b.item_unit||'\uFFFF')
          || natCmp(a.item_name, b.item_name);
    });
    var saleRows = salesOrdered.map(function(s){
      var collected = collectedBySale[s.id]||0; // المحصل من العميل (dated sub-ledger)
      var remaining = Number(s.sale_amount) - collected;
      var totalDues = Number(s.sale_amount) + Number(s.garage_value||0) + Number(s.maintenance_value||0) + Number(s.utilities_value||0);
      totalSold += Number(s.sale_amount); totalCollected += collected;
      return '<tr>'+selectColCell('inv-sales', s.id)+
        '<td>'+escapeHtml(s.building_no||'—')+'</td>'+
        '<td>'+escapeHtml(s.item_name)+'</td>'+
        '<td>'+fmtDate(s.sale_date)+'</td>'+
        '<td>'+escapeHtml(s.customer_name||'—')+'</td>'+
        '<td class="amt">'+money(s.sale_amount)+'</td>'+
        '<td class="amt credit">'+money(collected)+' <button class="btn ghost sm" data-view-collections="'+s.id+'" style="margin-right:4px;">تفاصيل</button></td>'+
        '<td class="amt '+(remaining>0.001?'debit remaining-pos':'remaining-zero')+'">'+money(remaining)+'</td>'+
        '<td class="amt">'+money(s.garage_value)+'</td>'+
        '<td class="amt credit">'+money(s.garage_collected)+'</td>'+
        '<td class="amt">'+money(s.maintenance_value)+'</td>'+
        '<td class="amt credit">'+money(s.maintenance_collected)+'</td>'+
        '<td class="amt">'+money(s.utilities_value)+'</td>'+
        '<td class="amt credit">'+money(s.utilities_collected)+'</td>'+
        '<td class="amt teal">'+money(totalDues)+'</td>'+
        '<td class="amt">'+money(s.collection_diff)+'</td>'+
        '<td class="mono">'+(s.down_payment_percent!=null?s.down_payment_percent+'%':'—')+'</td>'+
        '<td class="mono">'+(s.item_net_area!=null?s.item_net_area:'—')+'</td>'+
        '<td class="mono">'+(s.item_garden_area!=null?s.item_garden_area:'—')+'</td>'+
        '<td><button class="btn ghost sm" data-collect-sale="'+s.id+'" data-remaining="'+(Number(s.sale_amount)-collected).toFixed(2)+'">تحصيل</button></td>'+
        '<td><button class="btn ghost sm" data-edit-sale="'+s.id+'">تعديل</button></td>'+
        '<td><button class="del-x" data-del-sale="'+s.id+'">✕</button></td></tr>'+
        saleCollectionsDetailRow(s.id, collections);
    }).join('') || '<tr><td colspan="21" class="empty">لا توجد مبيعات مسجلة بعد</td></tr>';
    var totalRemaining = totalSold - totalCollected;

    var period = uiState.invCollectionPeriod;
    var periods = [{k:'day',l:'يومي'},{k:'week',l:'أسبوعي'},{k:'month',l:'شهري'},{k:'year',l:'سنوي'}];
    var periodChips = periods.map(function(p){
      return '<div class="period-chip'+(period===p.k?' active':'')+'" data-collection-period="'+p.k+'">'+p.l+'</div>';
    }).join('');
    var collectionsWithDate = collections.map(function(c){ return {entry_date:c.collection_date, amount:c.amount, description:c.description}; });
    var collGroups = groupEntriesByPeriod(collectionsWithDate, period);
    var collGroupsHtml = collGroups.map(function(g){
      var rows = g.items.map(function(c){
        return '<tr><td>'+fmtDate(c.entry_date)+'</td><td>'+escapeHtml(c.description||'—')+'</td><td class="amt credit">+'+money(c.amount)+'</td></tr>';
      }).join('');
      return '<div class="group-block"><div class="group-head"><span>'+escapeHtml(g.label)+'</span><span class="amt credit">'+money(g.total)+'</span></div>'+
        '<table><thead><tr><th>التاريخ</th><th>البيان</th><th>المبلغ</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
    }).join('') || '<div class="empty">لا توجد تحصيلات مسجلة بعد</div>';

    // expense remaining summary
    var expEntries = (cache.entries[pid]||[]).filter(function(e){return e.kind==='expense';});
    var payments = cache.expensePayments[pid] || [];
    var paidByEntry = {};
    payments.forEach(function(p){ paidByEntry[p.entry_id] = (paidByEntry[p.entry_id]||0) + Number(p.amount); });
    var totalExpense=0, totalPaid=0;
    var expRows = expEntries.map(function(e){
      var paid = paidByEntry[e.id]||0;
      var remaining = Number(e.amount)-paid;
      totalExpense += Number(e.amount); totalPaid += paid;
      return '<tr><td>'+fmtDate(e.entry_date)+'</td><td>'+(e.category?escapeHtml(e.category):'—')+'</td>'+
        '<td>'+escapeHtml(e.description||'—')+'</td><td class="amt debit">'+money(e.amount)+'</td>'+
        '<td class="amt credit">'+money(paid)+'</td>'+
        '<td class="amt '+(remaining>0.001?'debit remaining-pos':'remaining-zero')+'">'+money(remaining)+'</td></tr>';

  var ledgerInstanceCounter = 0;
  function ledgerTableHtml(opts){
    var hasDetails = !!opts.transactions;
    var instanceId = 'led'+(ledgerInstanceCounter++);
    var kindLabel = {deposit:'إيداع', withdrawal:'سحب', distribution:'توزيع أرباح'};
    var kindTag = {deposit:'dep', withdrawal:'wd', distribution:'dist'};
    var showPartnerCol = hasDetails && !!opts.partnersById;

    var rows = opts.months.map(function(mo){
      var rowId = instanceId+'-m'+mo.month;
      var mainRow = '<tr'+(hasDetails?' class="ledger-month-row" data-ledger-toggle="'+rowId+'" style="cursor:pointer;"':'')+'>'+
        '<td>'+(hasDetails?'<span class="ledger-caret" id="caret-'+rowId+'">▸</span> ':'')+EA_MONTHS[mo.month-1]+' '+opts.year+'</td>'+
        '<td class="amt debit">'+eaNum(mo.debit)+'</td>'+
        '<td class="amt credit">'+eaNum(mo.credit)+'</td>'+
        '<td class="amt '+(mo.balance>=0?'credit':'debit')+'">'+money(mo.balance)+(hasDetails?' '+balanceTag(mo.balance):'')+'</td></tr>';
      if(!hasDetails) return mainRow;

      var monthTx = opts.transactions.filter(function(t){
        var ds = String(t.entry_date).slice(0,10); // 'YYYY-MM-DD', whether entry_date arrived date-only or as a full ISO timestamp
        return parseInt(ds.slice(5,7),10)===mo.month && parseInt(ds.slice(0,4),10)===opts.year;
      }).sort(function(a,b){ return (a.entry_date||'').localeCompare(b.entry_date||''); });
      var detailBody = monthTx.length ? monthTx.map(function(t){
        var isCredit = t.kind!=='withdrawal';
        return '<tr><td>'+fmtDate(t.entry_date)+'</td>'+
          (showPartnerCol?('<td>'+escapeHtml(opts.partnersById[t.partner_id]||'—')+'</td>'):'')+
          '<td><span class="tag '+kindTag[t.kind]+'">'+kindLabel[t.kind]+'</span></td>'+
          '<td>'+escapeHtml(t.description||'—')+'</td>'+
          '<td class="amt '+(isCredit?'credit':'debit')+'">'+(isCredit?'+':'-')+money(t.amount)+'</td></tr>';
      }).join('') : '<tr><td colspan="'+(showPartnerCol?5:4)+'" class="empty">لا توجد حركات في هذا الشهر</td></tr>';
      var detailRow = '<tr id="'+rowId+'" class="ledger-detail-row" style="display:none;"><td colspan="4" style="padding:10px 14px;background:#faf7ea;">'+
        '<table><thead><tr><th>التاريخ</th>'+(showPartnerCol?'<th>الشريك</th>':'')+'<th>النوع</th><th>البيان</th><th>المبلغ</th></tr></thead><tbody>'+detailBody+'</tbody></table>'+
        '</td></tr>';
      return mainRow + detailRow;
    }).join('');

    return '<div class="panel"><div class="panel-head"><h3>'+opts.title+'</h3></div><div class="panel-body" style="padding:0;overflow-x:auto;">'+
      (hasDetails ? '<div class="muted-note" style="padding:10px 14px 0;">اضغط على أي شهر لعرض تفاصيل حركاته.</div>' : '')+
      '<table><thead><tr><th>الشهر</th><th>'+opts.debitLabel+'</th><th>'+opts.creditLabel+'</th><th>الرصيد آخر الشهر</th></tr></thead><tbody>'+
        '<tr style="background:#f2ecdb;font-weight:700;"><td colspan="3">'+opts.openingLabel+'</td><td class="amt">'+money(opts.openingBalance)+(hasDetails?' '+balanceTag(opts.openingBalance):'')+'</td></tr>'+
        rows+
        '<tr class="ea-grand"><td colspan="3">'+opts.closingLabel+'</td><td class="amt">'+money(opts.closingBalance)+(hasDetails?' '+balanceTag(opts.closingBalance):'')+'</td></tr>'+
      '</tbody></table>'+
    '</div></div>';
  }

  function exportExpenseAnalysis(){
    var data = eaCurrent();
    if(!data) return;
    if(typeof XLSX==='undefined'){ alert('مكتبة الإكسيل لم تُحمّل، حدّث الصفحة وحاول تاني'); return; }
    var built = eaBuildRows(data, data.chart || [], uiState.eaShowZero);
    var r2 = function(v){ return Math.round(v*100)/100; };
    var aoa = [
      ['تحليل المصاريف'],
      [eaScopeLabel(uiState.eaScope)],
      ['تحليل المصاريف : يناير-'+data.year+' الى ديسمبر-'+data.year],
      [],
      ['اسم البند'].concat(EA_MONTHS, ['الإجمالي'])
    ];
    built.rows.forEach(function(r){
      aoa.push([new Array(r.depth*3+1).join(' ')+r.name].concat(r.months.map(r2), [r2(r.total)]));
    });
    aoa.push(['المجموع الكلي'].concat(built.grand.months.map(r2), [r2(built.grand.total)]));
    var ws = XLSX.utils.aoa_to_sheet(aoa);
    Object.keys(ws).forEach(function(addr){
      if(addr.charAt(0)==='!') return;
      if(ws[addr].t==='n') ws[addr].z = '#,##0.00';
    });
    ws['!cols'] = [{wch:50}].concat(EA_MONTHS.map(function(){ return {wch:14}; }), [{wch:16}]);
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'تحليل المصاريف');
    wb.Workbook = {Views:[{RTL:true}]};
    XLSX.writeFile(wb, 'تحليل_المصاريف_'+data.year+'.xlsx');
  }

  function pageExpenseItems(){
    var tree = cache.expenseItems || [];
    var rows = [];
    (function walk(nodes, depth){
      nodes.forEach(function(n){
        var isGroup = !!(n.c && n.c.length);
        rows.push('<tr class="ei-row'+(depth===0?' ei-root':'')+'" data-name="'+escapeHtml(n.n)+'">'+
          '<td style="padding-right:'+(12+depth*22)+'px;'+(isGroup?'font-weight:700;':'')+'">'+
            (depth>0?'<span style="color:var(--ink-soft);">└ </span>':'')+escapeHtml(n.n)+
            (isGroup?' <span class="muted-note" style="display:inline;">('+n.c.length+')</span>':'')+'</td>'+
          '<td style="white-space:nowrap;text-align:left;">'+
            '<button class="btn ghost sm" type="button" data-ei-add="'+n.id+'">＋ بند فرعي</button> '+
            '<button class="btn ghost sm" type="button" data-ei-rename="'+n.id+'">تعديل الاسم</button> '+
            '<button class="btn danger sm" type="button" data-ei-del="'+n.id+'">حذف</button>'+
          '</td></tr>');
        if(isGroup) walk(n.c, depth+1);
      });
    })(tree, 0);
    return '<div class="page-head"><h2>بنود المصاريف</h2><p>أضف بندًا رئيسيًا، أو بندًا فرعيًا تحت أي بند. البنود دي هي اللي بتظهر عند تسجيل المصروف وفي تقرير تحليل المصاريف.</p></div>'+
    '<div class="panel"><div class="panel-head"><h3>إضافة بند رئيسي</h3></div><div class="panel-body">'+
      '<form id="ei-add-root-form" style="display:flex;gap:10px;align-items:end;flex-wrap:wrap;">'+
        '<div class="field" style="flex:1;min-width:240px;margin:0;"><label>اسم البند الرئيسي</label><input type="text" id="ei-root-name" required></div>'+
        '<button class="btn" type="submit">إضافة</button>'+
      '</form>'+
      '<div class="muted-note" style="margin-top:8px;">لإضافة بند فرعي اضغط "＋ بند فرعي" جنب البند اللي عايز تضيف تحته. أي مصروف مسجل بالفعل على بند بتغيّر اسمه بيتحدّث تلقائيًا.</div>'+
    '</div></div>'+
    '<div class="panel"><div class="panel-head"><h3>شجرة البنود ('+eiCount(tree)+')</h3>'+
      '<input type="text" id="ei-filter" placeholder="بحث في البنود…" style="max-width:240px;"></div>'+
      '<div class="panel-body" style="padding:0;overflow-x:auto;">'+
        (rows.length ? '<table><tbody>'+rows.join('')+'</tbody></table>' : '<div class="empty">لا توجد بنود بعد. أضف أول بند رئيسي من النموذج بالأعلى.</div>')+
      '</div></div>';
  }

    function payableSelection(){
      var pid = uiState.entriesProjectId;
      var paid = {};
      (cache.expensePayments[pid]||[]).forEach(function(pm){ paid[pm.entry_id] = (paid[pm.entry_id]||0) + Number(pm.amount); });
      var chosen = Array.from(getSelectionSet('entries')).map(Number);
      var out = [];
      (cache.entries[pid]||[]).forEach(function(e){
        if(chosen.indexOf(e.id)<0 || e.kind!=='expense') return;
        var rem = Number(e.amount) - (paid[e.id]||0);
        if(rem>0.005) out.push({id:e.id, remaining:rem});
      });
      return out;
    }

  async function loadPartnerDashboard(){
    var main = document.getElementById('main-area');
    try{
      var initial = await Promise.all([api('GET','/me/projects'), api('GET','/me/companies')]);
      cache.meProjects = initial[0]; cache.meCompanies = initial[1];
      if(!partnerActiveProject && cache.meProjects.length) partnerActiveProject = cache.meProjects[0].id;
      if(!partnerActiveCompany && cache.meCompanies.length) partnerActiveCompany = cache.meCompanies[0].id;
      if(cache.meProjects.length===0 && cache.meCompanies.length===0){
        main.innerHTML = '<div class="page-head"><h2>حسابك</h2></div><div class="panel"><div class="empty">لم يتم ربطك بأي شركة أو مشروع بعد. تواصل مع المدير المسؤول عن إدخال البيانات.</div></div>';
        return;
      }
      var calls = [];
      if(partnerActiveProject){
        calls.push(api('GET','/report/'+partnerActiveProject));
        calls.push(api('GET','/entries?projectId='+partnerActiveProject));
        calls.push(api('GET','/expense-payments?projectId='+partnerActiveProject));
        calls.push(api('GET','/inventory/items?projectId='+partnerActiveProject));
        calls.push(api('GET','/inventory/sales?projectId='+partnerActiveProject));
        calls.push(api('GET','/inventory/collections?projectId='+partnerActiveProject));
      } else {
        calls.push(null, [], [], [], [], []);
      }
      if(partnerActiveCompany){
        calls.push(api('GET','/current-account/ledger?companyId='+partnerActiveCompany));
        calls.push(api('GET','/current-account?companyId='+partnerActiveCompany));
      } else {
        calls.push(null, []);
      }
      calls.push(partnerActiveCompany ? api('GET','/me/expense-summary?companyId='+partnerActiveCompany) : null);
      calls.push(partnerActiveProject ? api('GET','/me/expense-summary?projectId='+partnerActiveProject) : null);
      var results = await Promise.all(calls);
      cache.meExpCompany = results[8]; cache.meExpProject = results[9];
      partnerData = { rep:results[0], entries:results[1], expPayments:results[2], invItems:results[3], invSales:results[4],
                      invCollections:results[5], ledger:results[6], caTx:results[7] };
      renderPartnerPage();
    }catch(e){
      main.innerHTML = '<div class="panel"><div class="panel-body"><div class="error-box">'+escapeHtml(e.message)+'</div></div></div>';
    }
  }
  function partnerGroupRowsHtml(groups){

    try{

      var data = await api('GET','/me/expense-periods?'+q);
      partnerPeriods = { key: partnerPeriodKey(), data: data };
      if(partnerTab==='periods') renderPartnerPage();
    }catch(e){ main.innerHTML = '<div class="panel"><div class="panel-body"><div class="error-box">'+escapeHtml(e.message)+'</div></div></div>'; }
  }
  function periodLabelFromKey(period, key){
    if(period==='year') return 'سنة '+key;
    if(period==='month'){ var m = key.split('-'); return EA_MONTHS[Number(m[1])-1]+' '+m[0]; }
    if(period==='week') return 'أسبوع '+fmtDate(key);
    return fmtDate(key);
  }
  function ppPeriods(){
    var d = partnerPeriods.data;
    var hasCompany = !!partnerActiveCompany, hasProject = !!partnerActiveProject;
    var coName = (cache.meCompanies.find(function(c){ return c.id===partnerActiveCompany; })||{}).name;
    var prName = (cache.meProjects.find(function(p){ return p.id===partnerActiveProject; })||{}).name;
    var scopeChips = '<div class="select-projects">'+
      (hasCompany ? '<div class="chip'+(d.scope==='company'?' active':'')+'" data-pscope="company">الشركة ككل — '+escapeHtml(coName||'')+'</div>' : '')+
      (hasProject ? '<div class="chip'+(d.scope==='project'?' active':'')+'" data-pscope="project">المشروع فقط — '+escapeHtml(prName||'')+'</div>' : '')+'</div>';
    var periodChips = [['day','يومي'],['week','أسبوعي'],['month','شهري'],['year','سنوي']].map(function(p){
      return '<div class="period-chip'+(partnerPeriod===p[0]?' active':'')+'" data-pperiod="'+p[0]+'">'+p[1]+'</div>'; }).join('');
    var rows = d.periods.map(function(p, i){
      var id = 'pp-'+i;
      return '<tr class="ledger-month-row" data-ledger-toggle="'+id+'" style="cursor:pointer;"><td><span class="ledger-caret" id="caret-'+id+'">▸</span> '+escapeHtml(periodLabelFromKey(d.period, p.key))+'</td>'+
        '<td class="amt debit">'+money(p.total)+'</td><td class="amt teal">'+money(p.myShare)+'</td></tr>'+
        '<tr id="'+id+'" class="ledger-detail-row" style="display:none;"><td colspan="3" style="padding:10px 14px;background:#faf7ea;">'+
          '<table><thead><tr><th>البند</th><th>الإجمالي</th><th>نصيبك ('+d.percentage+'%)</th></tr></thead><tbody>'+partnerGroupRowsHtml(p.groups)+'</tbody></table>'+
        '</td></tr>';
    }).join('') || '<tr><td colspan="3" class="empty">لا توجد مصاريف مسجلة بعد</td></tr>';
    return partnerHead('تحليل الفترات للمصاريف — «'+escapeHtml(d.name)+'»', 'إجمالي المصاريف في كل فترة ونصيبك منها. اضغط على أي فترة لعرض بنودها الرئيسية.')+scopeChips+
      (d.scope==='company' ? partnerChipsHtml('company') : partnerChipsHtml('project'))+
      '<div class="period-toggle">'+periodChips+'</div>'+
      '<div class="grid-stats">'+
        '<div class="stat"><div class="label">إجمالي المصاريف في كل الفترات</div><div class="val debit">'+money(d.total)+'</div></div>'+
        '<div class="stat"><div class="label">نسبتك</div><div class="val teal">'+d.percentage+'%</div></div>'+
        '<div class="stat"><div class="label">نصيبك من المصاريف</div><div class="val teal">'+money(d.myShare)+'</div></div>'+
        '<div class="stat"><div class="label">عدد الفترات</div><div class="val">'+d.periods.length+'</div></div>'+
      '</div>'+
      '<div class="panel"><div class="panel-head"><h3>المصاريف حسب الفترة</h3></div><div class="panel-body" style="padding:0;overflow-x:auto;">'+
        '<table><thead><tr><th>الفترة</th><th>إجمالي المصاريف</th><th>نصيبك</th></tr></thead><tbody>'+rows+
        '<tr class="ea-grand"><td>الإجمالي</td><td class="amt">'+money(d.total)+'</td><td class="amt">'+money(d.myShare)+'</td></tr></tbody></table></div></div>';
  }
  function bindPartnerPeriodControls(){
    document.querySelectorAll('[data-pperiod]').forEach(function(c){
      c.addEventListener('click', function(){ partnerPeriod = c.getAttribute('data-pperiod'); renderPartnerPage(); });
    });
    document.querySelectorAll('[data-pscope]').forEach(function(c){
      c.addEventListener('click', function(){ partnerPeriodScope = c.getAttribute('data-pscope'); renderPartnerPage(); });
    });
  }

  render();
})();
</script>
</body>
</html>
