<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دفتر الشركاء</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --ink:#1c1a15; --ink-soft:#5c5747; --paper:#f5f1e6; --paper-raised:#fffdf7;
    --line:#d8d0ba; --teal:#0e3b36; --teal-deep:#082622; --brass:#b3812f; --brass-soft:#e8d9b5;
    --credit:#356b4e; --debit:#a13c33; --radius:3px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--paper);color:var(--ink);font-family:'Tajawal',sans-serif;min-height:100vh;}
  #app{min-height:100vh;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .ledger-card{width:100%;max-width:380px;background:var(--paper-raised);border:1px solid var(--line);border-top:6px solid var(--teal);border-radius:var(--radius);padding:36px 30px 30px;}
  .brand{display:flex;align-items:baseline;gap:10px;margin-bottom:6px;}
  .brand .mark{width:34px;height:34px;border:2px solid var(--teal);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--teal);font-weight:900;font-size:16px;flex:none;}
  .brand h1{font-size:21px;margin:0;font-weight:900;color:var(--teal-deep);}
  .sub{color:var(--ink-soft);font-size:13.5px;margin:0 0 26px;line-height:1.7;}
  label{display:block;font-size:12.5px;color:var(--ink-soft);margin-bottom:6px;font-weight:500;}
  .field{margin-bottom:16px;}
  input[type=text],input[type=password],input[type=number],input[type=date],select,textarea{
    width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:var(--radius);background:#fff;font-family:inherit;font-size:14.5px;color:var(--ink);
  }
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(14,59,54,.12);}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--teal);color:#fff;border:none;padding:11px 18px;border-radius:var(--radius);font-family:inherit;font-size:14.5px;font-weight:700;cursor:pointer;transition:background .15s;}
  .btn:hover{background:var(--teal-deep);}
  .btn.block{width:100%;}
  .btn.ghost{background:transparent;color:var(--teal);border:1px solid var(--teal);}
  .btn.ghost:hover{background:rgba(14,59,54,.06);}
  .btn.sm{padding:7px 12px;font-size:13px;}
  .btn.danger{background:transparent;color:var(--debit);border:1px solid var(--debit);padding:7px 12px;font-size:13px;}
  .btn.danger:hover{background:rgba(161,60,51,.08);}
  .error-box{background:#fbeceb;border:1px solid #e6b6b0;color:var(--debit);padding:10px 12px;border-radius:var(--radius);font-size:13px;margin-bottom:16px;}
  .ok-box{background:#e3efe6;border:1px solid #b9d7c3;color:var(--credit);padding:10px 12px;border-radius:var(--radius);font-size:13px;margin-bottom:16px;}
  .hint-creds{margin-top:20px;padding-top:16px;border-top:1px dashed var(--line);font-size:12px;color:var(--ink-soft);line-height:1.8;}
  .shell{display:flex;min-height:100vh;}
  .sidebar{width:230px;flex:none;background:var(--teal-deep);color:#e9e4d4;padding:24px 18px;display:flex;flex-direction:column;}
  .sidebar .brand{color:#fff;margin-bottom:2px;}
  .sidebar .brand .mark{border-color:var(--brass-soft);color:var(--brass-soft);}
  .sidebar .brand h1{color:#fff;font-size:18px;}
  .who{font-size:12.5px;color:#b9c9c2;margin:4px 0 26px;padding-bottom:18px;border-bottom:1px solid rgba(255,255,255,.12);}
  .who b{color:#fff;display:block;font-size:14px;margin-top:2px;}
  .nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius);color:#cdd6cd;font-size:14px;cursor:pointer;margin-bottom:2px;}
  .nav-item:hover{background:rgba(255,255,255,.06);}
  .nav-item.active{background:rgba(179,129,47,.85);color:#fff;font-weight:700;}
  .sidebar-foot{margin-top:auto;padding-top:18px;display:flex;flex-direction:column;gap:10px;}
  .logout-link{color:#e2bdb8;font-size:13px;cursor:pointer;background:none;border:none;font-family:inherit;padding:0;text-align:right;}
  .logout-link:hover{text-decoration:underline;}
  .main{flex:1;padding:30px 34px;max-width:1180px;}
  .page-head{margin-bottom:26px;}
  .page-head h2{margin:0 0 4px;font-size:22px;color:var(--teal-deep);font-weight:900;}
  .page-head p{margin:0;color:var(--ink-soft);font-size:13.5px;}
  .grid-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:26px;}
  .stat{background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;}
  .stat .label{font-size:12px;color:var(--ink-soft);margin-bottom:8px;}
  .stat .val{font-size:22px;font-weight:900;font-family:'IBM Plex Mono',monospace;}
  .stat .val.credit{color:var(--credit);} .stat .val.debit{color:var(--debit);} .stat .val.teal{color:var(--teal);}
  .panel{background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:22px;overflow:hidden;}
  .panel-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line);background:#fbf8f0;}
  .panel-head h3{margin:0;font-size:15px;font-weight:700;color:var(--teal-deep);}
  .panel-body{padding:18px;}
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:right;font-size:11.5px;color:var(--ink-soft);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line);}
  td{padding:10px 10px;border-bottom:1px solid #ece6d4;vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  .amt{font-family:'IBM Plex Mono',monospace;font-weight:700;}
  .amt.credit{color:var(--credit);} .amt.debit{color:var(--debit);}
  .tag{display:inline-block;font-size:11px;padding:2px 9px;border-radius:20px;font-weight:700;}
  .tag.rev{background:#e3efe6;color:var(--credit);} .tag.exp{background:#f6e4e2;color:var(--debit);}
  .tag.dep{background:#e3efe6;color:var(--credit);} .tag.wd{background:#f6e4e2;color:var(--debit);}
  .tag.dist{background:var(--brass-soft);color:#7a5518;}
  .empty{padding:30px 10px;text-align:center;color:var(--ink-soft);font-size:13.5px;}
  .form-row{display:grid;gap:14px;grid-template-columns:1fr 1fr;margin-bottom:2px;}
  .form-row.three{grid-template-columns:1fr 1fr 1fr;}
  @media (max-width:720px){.form-row,.form-row.three{grid-template-columns:1fr;}}
  .partner-pct-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #ece6d4;}
  .partner-pct-row:last-child{border-bottom:none;}
  .partner-pct-row .pname{flex:1;font-size:14px;}
  .partner-pct-row input{width:90px;}
  .pct-total{margin-top:10px;font-size:13px;padding:8px 10px;border-radius:var(--radius);}
  .pct-total.ok{background:#e3efe6;color:var(--credit);} .pct-total.bad{background:#f6e4e2;color:var(--debit);}
  .select-projects{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px;}
  .chip{padding:8px 16px;border:1px solid var(--line);border-radius:20px;font-size:13.5px;cursor:pointer;background:#fff;color:var(--ink-soft);font-weight:500;}
  .chip.active{background:var(--teal);color:#fff;border-color:var(--teal);font-weight:700;}
  .balance-banner{display:flex;align-items:center;justify-content:space-between;background:var(--teal-deep);color:#fff;padding:22px 24px;border-radius:var(--radius);margin-bottom:22px;flex-wrap:wrap;gap:10px;}
  .balance-banner .l{font-size:13px;color:#bcd0c8;margin-bottom:6px;}
  .balance-banner .v{font-size:30px;font-weight:900;font-family:'IBM Plex Mono',monospace;}
  .balance-banner .pct{font-size:13px;color:#d7e4dc;}
  .del-x{background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:16px;padding:2px 6px;line-height:1;}
  .del-x:hover{color:var(--debit);}
  .inline-pw{display:flex;gap:6px;align-items:center;}
  .inline-pw input{width:130px;padding:6px 8px;font-size:12.5px;}
  .tag.cat{background:#eee6d6;color:#7a5c1c;}
  .period-toggle{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap;}
  .period-chip{padding:7px 16px;border:1px solid var(--line);border-radius:20px;font-size:13px;cursor:pointer;background:#fff;color:var(--ink-soft);font-weight:600;}
  .period-chip.active{background:var(--brass);color:#fff;border-color:var(--brass);}
  .group-block{border:1px solid var(--line);border-radius:var(--radius);margin-bottom:12px;overflow:hidden;}
  .group-head{display:flex;align-items:center;justify-content:space-between;padding:11px 16px;background:#f2ecdb;font-size:13.5px;font-weight:700;color:var(--teal-deep);}
  .group-head .amt{font-size:14.5px;}
  .cat-chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 16px;border-bottom:1px solid #ece6d4;background:#fbf8f0;}
  .cat-chip{font-size:11.5px;padding:3px 10px;border-radius:14px;background:#eee6d6;color:#7a5c1c;font-weight:600;}
  .remaining-pos{color:var(--debit);font-weight:700;}
  .remaining-zero{color:var(--ink-soft);}
  @media (max-width:860px){
    .shell{flex-direction:column;}
    .sidebar{width:100%;flex-direction:row;align-items:center;padding:14px 18px;flex-wrap:wrap;}
    .sidebar .brand{margin-bottom:0;margin-left:auto;order:1;}
    .who{display:none;}
    .sidebar-foot{margin-top:0;order:2;flex-direction:row;}
    .nav-row{display:flex;gap:6px;flex-wrap:wrap;order:3;width:100%;margin-top:10px;}
    .main{padding:20px 16px;}
  }
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
  "use strict";
  var API = "/api";
  var token = localStorage.getItem('pl_token') || null;
  var currentUser = JSON.parse(localStorage.getItem('pl_user') || 'null');
  var loginError = "";
  var adminTab = 'partners';
  var partnerActiveProject = null;
  var cache = { partners:[], projects:[], companies:[], entries:{}, currentAccount:{}, meProjects:[], report:{},
    expensePayments:{}, inventoryItems:{}, inventorySales:{}, inventoryCollections:{} };
  var uiState = { entriesProjectId:null, caProjectId:null, reportProjectId:null,
    analyticsProjectId:null, analyticsPeriod:'month', invProjectId:null, invCollectionPeriod:'month' };

  var EXPENSE_CATEGORIES = ['رواتب وأجور','إيجار','مواد خام / بضاعة','نقل ومواصلات','صيانة','كهرباء ومياه','تسويق وإعلان','ضرائب ورسوم','أخرى'];

  function pad2(n){ return n<10 ? '0'+n : ''+n; }
  function periodKeyLabel(dateStr, period){
    var d = new Date(dateStr+'T00:00:00');
    if(isNaN(d)) return {key:'—', label:'—', sort:''};
    if(period==='day'){
      var k = dateStr;
      return {key:k, label:fmtDate(dateStr), sort:k};
    }
    if(period==='week'){
      var day = (d.getDay()+6)%7; // 0=Monday
      var monday = new Date(d); monday.setDate(d.getDate()-day);
      var k2 = monday.toISOString().slice(0,10);
      return {key:k2, label:'أسبوع '+fmtDate(k2), sort:k2};
    }
    if(period==='year'){
      var y = d.getFullYear();
      return {key:''+y, label:'سنة '+y, sort:''+y};
    }
    // month default
    var ym = d.getFullYear()+'-'+pad2(d.getMonth()+1);
    var monthNames = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
    return {key:ym, label:monthNames[d.getMonth()]+' '+d.getFullYear(), sort:ym};
  }
  function groupEntriesByPeriod(entries, period){
    var map = {};
    entries.forEach(function(e){
      var pk = periodKeyLabel(e.entry_date, period);
      if(!map[pk.key]) map[pk.key] = {label:pk.label, sort:pk.sort, total:0, items:[], categories:{}};
      map[pk.key].total += Number(e.amount);
      map[pk.key].items.push(e);
      if(e.category){
        map[pk.key].categories[e.category] = (map[pk.key].categories[e.category]||0) + Number(e.amount);
      }
    });
    return Object.keys(map).map(function(k){return map[k];}).sort(function(a,b){ return b.sort.localeCompare(a.sort); });
  }

  // ---- Excel import helpers ----
  function excelToISODate(v){
    if(v===null || v===undefined || v==='') return null;
    if(v instanceof Date && !isNaN(v)) return v.toISOString().slice(0,10);
    if(typeof v === 'number'){
      var d = new Date(Math.round((v-25569)*86400*1000));
      return isNaN(d) ? null : d.toISOString().slice(0,10);
    }
    var s = String(v).trim();
    var m1 = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
    if(m1) return m1[1]+'-'+pad2(+m1[2])+'-'+pad2(+m1[3]);
    var m2 = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
    if(m2) return m2[3]+'-'+pad2(+m2[1])+'-'+pad2(+m2[2]); // dd/mm/yyyy (Egypt convention)
    var d2 = new Date(s);
    return isNaN(d2) ? null : d2.toISOString().slice(0,10);
  }
  function excelToNumber(v){
    if(typeof v === 'number') return v;
    if(v===null || v===undefined || v==='') return NaN;
    var s = String(v).replace(/,/g,'').trim();
    return parseFloat(s);
  }
  function readExcelRows(file){
    return new Promise(function(resolve, reject){
      if(typeof XLSX === 'undefined'){ reject(new Error('مكتبة قراءة الإكسيل لم تُحمّل، حاول تحديث الصفحة')); return; }
      var reader = new FileReader();
      reader.onload = function(e){
        try{
          var wb = XLSX.read(e.target.result, {type:'array', cellDates:true});
          var sheet = wb.Sheets[wb.SheetNames[0]];
          var rows = XLSX.utils.sheet_to_json(sheet, {defval:''});
          resolve(rows);
        }catch(err){ reject(new Error('تعذرت قراءة الملف، تأكد إنه ملف إكسيل صحيح')); }
      };
      reader.onerror = function(){ reject(new Error('تعذرت قراءة الملف')); };
      reader.readAsArrayBuffer(file);
    });
  }
  function importPanelHtml(idPrefix, title, columnsDesc){
    return '<div class="panel"><div class="panel-head"><h3>'+title+'</h3></div><div class="panel-body">'+
      '<div class="muted-note">الأعمدة المطلوبة في الصف الأول من ملف الإكسيل (بنفس الأسماء بالظبط): <b>'+columnsDesc+'</b></div>'+
      '<div class="field" style="max-width:320px;margin-top:10px;"><input type="file" id="'+idPrefix+'-file" accept=".xlsx,.xls,.csv"></div>'+
      '<div id="'+idPrefix+'-status"></div>'+
      '<button class="btn brass" id="'+idPrefix+'-confirm" style="display:none;margin-top:10px;">تأكيد الاستيراد</button>'+
    '</div></div>';
  }
  function bindImportPanel(idPrefix, mapRow, requiredCols, onConfirm){
    var fileInput = document.getElementById(idPrefix+'-file');
    if(!fileInput) return;
    var statusEl = document.getElementById(idPrefix+'-status');
    var confirmBtn = document.getElementById(idPrefix+'-confirm');
    var pendingRows = null;
    fileInput.addEventListener('change', async function(){
      confirmBtn.style.display = 'none';
      pendingRows = null;
      var file = fileInput.files[0];
      if(!file) return;
      statusEl.innerHTML = '<div class="empty">جارِ القراءة…</div>';
      try{
        var raw = await readExcelRows(file);
        if(!raw.length){ statusEl.innerHTML = '<div class="error-box">الملف فارغ</div>'; return; }
        var missing = requiredCols.filter(function(c){ return !(c in raw[0]); });
        if(missing.length){
          statusEl.innerHTML = '<div class="error-box">أعمدة ناقصة في الملف: '+missing.join('، ')+'</div>';
          return;
        }
        var valid = [], invalid = 0;
        raw.forEach(function(r){
          var mapped = mapRow(r);
          if(mapped) valid.push(mapped); else invalid++;
        });
        pendingRows = valid;
        statusEl.innerHTML = '<div class="ok-box">تم قراءة '+raw.length+' صف — صالح للاستيراد: '+valid.length+(invalid?('، تم تجاهله (بيانات ناقصة أو غير صحيحة): '+invalid):'')+'</div>';
        if(valid.length){ confirmBtn.style.display='inline-flex'; }
      }catch(e){
        statusEl.innerHTML = '<div class="error-box">'+escapeHtml(e.message)+'</div>';
      }
    });
    confirmBtn.addEventListener('click', async function(){
      if(!pendingRows || !pendingRows.length) return;
      confirmBtn.disabled = true; confirmBtn.textContent = 'جارِ الاستيراد…';
      try{
        await onConfirm(pendingRows);
        invalidateAndReload();
      }catch(e){
        alert(e.message); confirmBtn.disabled = false; confirmBtn.textContent = 'تأكيد الاستيراد';
      }
    });
  }
  function mapRevenueRow(r){
    var date = excelToISODate(r['التاريخ']);
    var amount = excelToNumber(r['المبلغ']);
    if(!date || !amount || isNaN(amount) || amount<=0) return null;
    return {date:date, description:String(r['البيان']||'').trim(), amount:amount};
  }
  function mapExpenseRow(r){
    var date = excelToISODate(r['التاريخ']);
    var amount = excelToNumber(r['المبلغ']);
    if(!date || !amount || isNaN(amount) || amount<=0) return null;
    return {date:date, description:String(r['البيان']||'').trim(), amount:amount, category:String(r['التصنيف']||'أخرى').trim()};
  }
  function mapInventoryRow(r){
    var name = String(r['اسم الصنف']||'').trim();
    var qty = excelToNumber(r['الكمية']);
    if(!name || isNaN(qty)) return null;
    return {name:name, unit:String(r['الوحدة']||'').trim(), quantityIn:qty, unitPrice: excelToNumber(r['سعر الوحدة'])||0};
  }
  function mapCurrentAccountRowFactory(partnersList){
    var byName = {};
    partnersList.forEach(function(p){ byName[String(p.name).trim()] = p.partnerId; });
    var kindMap = {'إيداع':'deposit','سحب':'withdrawal','توزيع أرباح':'distribution'};
    return function(r){
      var date = excelToISODate(r['التاريخ']);
      var amount = excelToNumber(r['المبلغ']);
      var partnerName = String(r['اسم الشريك']||'').trim();
      var kindText = String(r['النوع']||'').trim();
      var partnerId = byName[partnerName];
      var kind = kindMap[kindText];
      if(!date || !amount || isNaN(amount) || amount<=0 || !partnerId || !kind) return null;
      return {date:date, amount:amount, partnerId:partnerId, kind:kind, description:String(r['البيان']||'').trim()};
    };
  }

  function money(n){ n=Number(n)||0; return n.toLocaleString('ar-EG',{minimumFractionDigits:2,maximumFractionDigits:2}); }
  function fmtDate(s){ if(!s) return ""; var d = new Date(s); if(isNaN(d)) return s; return d.toLocaleDateString('ar-EG',{day:'2-digit',month:'2-digit',year:'numeric'}); }
  function todayStr(){ return new Date().toISOString().slice(0,10); }
  function escapeHtml(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }

  async function api(method, path, body){
    var opts = { method:method, headers:{'Content-Type':'application/json'} };
    if(token) opts.headers['Authorization'] = 'Bearer '+token;
    if(body!==undefined) opts.body = JSON.stringify(body);
    var res;
    try{
      res = await fetch(API+path, opts);
    }catch(e){
      throw new Error('تعذر الاتصال بالسيرفر. تأكد من اتصالك بالإنترنت.');
    }
    var data = null;
    try{ data = await res.json(); }catch(e){ /* no body */ }
    if(!res.ok){
      if(res.status===401){ logout(); }
      throw new Error((data && data.error) || 'حدث خطأ غير متوقع');
    }
    return data;
  }

  function saveSession(){
    if(token) localStorage.setItem('pl_token', token); else localStorage.removeItem('pl_token');
    if(currentUser) localStorage.setItem('pl_user', JSON.stringify(currentUser)); else localStorage.removeItem('pl_user');
  }
  function logout(){ token=null; currentUser=null; saveSession(); loginError=""; render(); }

  function render(){
    var app = document.getElementById('app');
    if(!currentUser){ app.innerHTML = renderLogin(); bindLogin(); return; }
    if(currentUser.role==='admin'){ app.innerHTML = renderAdminShell(); bindAdminShell(); }
    else { app.innerHTML = renderPartnerShell(); bindPartnerShell(); }
  }

  // ================= LOGIN =================
  function renderLogin(){
    return '<div class="login-wrap"><div class="ledger-card">'+
      '<div class="brand"><div class="mark">ش</div><h1>دفتر الشركاء</h1></div>'+
      '<p class="sub">سجّل الدخول لعرض حسابك الجاري وحساب المشروع الخاص بك.</p>'+
      (loginError ? '<div class="error-box">'+escapeHtml(loginError)+'</div>' : '')+
      '<form id="login-form">'+
        '<div class="field"><label>اسم المستخدم</label><input type="text" id="li-user" autocomplete="username" required></div>'+
        '<div class="field"><label>كلمة المرور</label><input type="password" id="li-pass" autocomplete="current-password" required></div>'+

  // Renders the current admin tab purely from whatever is already in `cache` — no network calls.
  // Used both after a successful fetch and for instant optimistic UI updates after add/delete.
  function renderAdminMain(){
    var main = document.getElementById('main-area');
    if(adminTab==='partners') main.innerHTML = pagePartners();
    else if(adminTab==='companies') main.innerHTML = pageCompanies();
    else if(adminTab==='projects') main.innerHTML = pageProjects();
    else if(adminTab==='entries') main.innerHTML = pageEntries();
    else if(adminTab==='analytics') main.innerHTML = pageAnalytics();
    else if(adminTab==='inventory') main.innerHTML = pageInventory();
    else if(adminTab==='current') main.innerHTML = pageCurrentAccount();
    else if(adminTab==='report') main.innerHTML = pageReport();
    else if(adminTab==='settings') main.innerHTML = pageSettings();
    bindAdminPageEvents();

  // Fetches whatever the current tab needs, but skips the network round-trip entirely
  // if that tab+project was already loaded (loadedTabs cache) — makes revisiting a tab instant.
  // Pass force=true (e.g. after switching the project dropdown, or a manual refresh) to refetch.
  var loadedTabs = {};
  async function loadAdminPage(force){
    var main = document.getElementById('main-area');
    var tabKey = adminTab;
    if(['entries','analytics','inventory','current','report'].indexOf(adminTab)>=0){
      var pidMap = {entries:'entriesProjectId', analytics:'analyticsProjectId', inventory:'invProjectId', current:'caProjectId', report:'reportProjectId'};
      tabKey = adminTab + ':' + (uiState[pidMap[adminTab]] || (cache.projects[0] && cache.projects[0].id) || '');
    }
    if(!force && loadedTabs[tabKey]){ renderAdminMain(); return; }
    main.innerHTML = '<div class="empty">جارِ التحميل…</div>';
    try{
      if(adminTab==='partners'){ cache.partners = await api('GET','/partners'); }
      else if(adminTab==='companies'){
        var coRes = await Promise.all([api('GET','/partners'), api('GET','/companies')]);
        cache.partners = coRes[0]; cache.companies = coRes[1];
      }
      else if(adminTab==='projects'){
        var pr = await Promise.all([api('GET','/partners'), api('GET','/projects'), api('GET','/companies')]);
        cache.partners = pr[0]; cache.projects = pr[1]; cache.companies = pr[2];
      }
      else if(adminTab==='entries'){
        cache.projects = cache.projects.length? cache.projects : await api('GET','/projects');
        if(cache.projects.length){
          if(!uiState.entriesProjectId) uiState.entriesProjectId = cache.projects[0].id;
          var epid = uiState.entriesProjectId;
          var enRes = await Promise.all([
            api('GET','/entries?projectId='+epid),
            api('GET','/expense-payments?projectId='+epid)
          ]);
          cache.entries[epid] = enRes[0];
          cache.expensePayments[epid] = enRes[1];
        }
      }
      else if(adminTab==='analytics'){
        cache.projects = cache.projects.length? cache.projects : await api('GET','/projects');
        if(cache.projects.length){
          if(!uiState.analyticsProjectId) uiState.analyticsProjectId = cache.projects[0].id;
          cache.entries[uiState.analyticsProjectId] = await api('GET','/entries?projectId='+uiState.analyticsProjectId);
        }
      }
      else if(adminTab==='inventory'){
        cache.projects = cache.projects.length? cache.projects : await api('GET','/projects');
        if(cache.projects.length){
          if(!uiState.invProjectId) uiState.invProjectId = cache.projects[0].id;
          var pid = uiState.invProjectId;
          var invRes = await Promise.all([
            api('GET','/inventory/items?projectId='+pid),
            api('GET','/inventory/sales?projectId='+pid),
            api('GET','/inventory/collections?projectId='+pid),
            api('GET','/entries?projectId='+pid),
            api('GET','/expense-payments?projectId='+pid)
          ]);
          cache.inventoryItems[pid] = invRes[0];
          cache.inventorySales[pid] = invRes[1];
          cache.inventoryCollections[pid] = invRes[2];
          cache.entries[pid] = invRes[3];
          cache.expensePayments[pid] = invRes[4];
        }
      }
      else if(adminTab==='current'){
        cache.projects = cache.projects.length? cache.projects : await api('GET','/projects');
        if(cache.projects.length){
          if(!uiState.caProjectId) uiState.caProjectId = cache.projects[0].id;
          cache.currentAccount[uiState.caProjectId] = await api('GET','/current-account?projectId='+uiState.caProjectId);
        }
      }
      else if(adminTab==='report'){
        cache.projects = cache.projects.length? cache.projects : await api('GET','/projects');
        if(cache.projects.length){
          if(!uiState.reportProjectId) uiState.reportProjectId = cache.projects[0].id;
          cache.report[uiState.reportProjectId] = await api('GET','/report/'+uiState.reportProjectId);
        }
      }
      loadedTabs[tabKey] = true;
      renderAdminMain();
    }catch(e){
      main.innerHTML = '<div class="panel"><div class="panel-body"><div class="error-box">'+escapeHtml(e.message)+'</div></div></div>';
    }
  }
  // Call after any add/delete mutation: clears this tab's cache flag and forces one fresh fetch,

  function invalidateAndReload(){ loadedTabs = {}; loadAdminPage(true); }

  function pageAnalytics(){
    if(cache.projects.length===0) return '<div class="page-head"><h2>تحليل الفترات</h2></div><div class="panel"><div class="empty">أنشئ مشروعًا أولاً.</div></div>';
    var pOptions = cache.projects.map(function(p){return '<option value="'+p.id+'"'+(p.id==uiState.analyticsProjectId?' selected':'')+'>'+escapeHtml(p.name)+'</option>';}).join('');
    var proj = cache.projects.find(function(p){return p.id==uiState.analyticsProjectId;});
    var list = cache.entries[uiState.analyticsProjectId] || [];
    var period = uiState.analyticsPeriod;
    var periods = [{k:'day',l:'يومي'},{k:'week',l:'أسبوعي'},{k:'month',l:'شهري'},{k:'year',l:'سنوي'}];
    var periodChips = periods.map(function(p){
      return '<div class="period-chip'+(period===p.k?' active':'')+'" data-period="'+p.k+'">'+p.l+'</div>';
    }).join('');

    var revEntries = list.filter(function(e){return e.kind==='revenue';});
    var expEntries = list.filter(function(e){return e.kind==='expense';});
    var revGroups = groupEntriesByPeriod(revEntries, period);
    var expGroups = groupEntriesByPeriod(expEntries, period);

    var projectName = proj ? proj.name : '';

    function renderRevGroup(g){
      var rows = g.items.map(function(e){
        return '<tr><td>'+fmtDate(e.entry_date)+'</td><td>'+escapeHtml(projectName)+'</td><td>'+escapeHtml(e.description||'—')+'</td>'+
          '<td class="amt credit">+'+money(e.amount)+'</td></tr>';
      }).join('');
      return '<div class="group-block"><div class="group-head"><span>'+escapeHtml(g.label)+'</span><span class="amt credit">'+money(g.total)+'</span></div>'+
        '<table><thead><tr><th>التاريخ</th><th>المشروع</th><th>البيان</th><th>المبلغ</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
    }
    function renderExpGroup(g){
      var catChips = Object.keys(g.categories).map(function(c){
        return '<span class="cat-chip">'+escapeHtml(c)+': '+money(g.categories[c])+'</span>';
      }).join('');
      var rows = g.items.map(function(e){
        return '<tr><td>'+fmtDate(e.entry_date)+'</td><td>'+(e.category?escapeHtml(e.category):'—')+'</td>'+
          '<td>'+escapeHtml(e.description||'—')+'</td><td class="amt debit">-'+money(e.amount)+'</td></tr>';
      }).join('');
      return '<div class="group-block"><div class="group-head"><span>'+escapeHtml(g.label)+'</span><span class="amt debit">'+money(g.total)+'</span></div>'+
        (catChips?('<div class="cat-chips">'+catChips+'</div>'):'')+
        '<table><thead><tr><th>التاريخ</th><th>التصنيف</th><th>البيان</th><th>المبلغ</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
    }

    return '<div class="page-head"><h2>تحليل الفترات</h2><p>الإيرادات والمصروفات مقسّمة يوميًا وأسبوعيًا وشهريًا وسنويًا.</p></div>'+
    '<div class="field" style="max-width:320px;margin-bottom:14px;"><label>المشروع</label><select id="analytics-project-select">'+pOptions+'</select></div>'+
    '<div class="period-toggle">'+periodChips+'</div>'+
    '<div class="panel"><div class="panel-head"><h3>الإيرادات</h3></div><div class="panel-body">'+
      (revGroups.length ? revGroups.map(renderRevGroup).join('') : '<div class="empty">لا توجد إيرادات في هذا المشروع بعد</div>')+
    '</div></div>'+
    '<div class="panel"><div class="panel-head"><h3>المصروفات حسب التصنيف</h3></div><div class="panel-body">'+
      (expGroups.length ? expGroups.map(renderExpGroup).join('') : '<div class="empty">لا توجد مصروفات في هذا المشروع بعد</div>')+
    '</div></div>';
  }

  function pageInventory(){
    if(cache.projects.length===0) return '<div class="page-head"><h2>المخزون والتحصيل</h2></div><div class="panel"><div class="empty">أنشئ مشروعًا أولاً.</div></div>';
    var pid = uiState.invProjectId;
    var pOptions = cache.projects.map(function(p){return '<option value="'+p.id+'"'+(p.id==pid?' selected':'')+'>'+escapeHtml(p.name)+'</option>';}).join('');
    var items = cache.inventoryItems[pid] || [];
    var sales = cache.inventorySales[pid] || [];
    var collections = cache.inventoryCollections[pid] || [];

    var soldByItem = {};
    sales.forEach(function(s){ soldByItem[s.item_id] = (soldByItem[s.item_id]||0) + Number(s.quantity); });
    var collectedBySale = {};
    collections.forEach(function(c){ collectedBySale[c.sale_id] = (collectedBySale[c.sale_id]||0) + Number(c.amount); });

    var itemRows = items.map(function(it){
      var sold = soldByItem[it.id]||0;
      var remainingQty = Number(it.quantity_in) - sold;
      return '<tr><td>'+escapeHtml(it.name)+'</td><td>'+escapeHtml(it.unit||'—')+'</td>'+
        '<td class="mono">'+it.quantity_in+'</td><td class="mono">'+sold+'</td>'+
        '<td class="mono '+(remainingQty<0?'debit':'')+'">'+remainingQty+'</td>'+
        '<td class="amt">'+money(it.unit_price)+'</td>'+
        '<td><button class="del-x" data-del-item="'+it.id+'">✕</button></td></tr>';
    }).join('') || '<tr><td colspan="7" class="empty">لا توجد أصناف مخزون لهذا المشروع بعد</td></tr>';

    var itemOptions = items.map(function(it){return '<option value="'+it.id+'">'+escapeHtml(it.name)+' ('+(Number(it.quantity_in)-(soldByItem[it.id]||0))+' متبقي)</option>';}).join('');

    var totalSold=0, totalCollected=0;
    var saleRows = sales.map(function(s){
      var collected = collectedBySale[s.id]||0;
      var remaining = Number(s.sale_amount) - collected;
      totalSold += Number(s.sale_amount); totalCollected += collected;
      return '<tr><td>'+fmtDate(s.sale_date)+'</td><td>'+escapeHtml(s.item_name)+'</td>'+
        '<td class="mono">'+s.quantity+'</td>'+
        '<td class="amt">'+money(s.sale_amount)+'</td>'+
        '<td class="amt credit">'+money(collected)+'</td>'+
        '<td class="amt '+(remaining>0.001?'debit remaining-pos':'remaining-zero')+'">'+money(remaining)+'</td>'+
        '<td><button class="btn ghost sm" data-collect-sale="'+s.id+'" data-remaining="'+remaining.toFixed(2)+'">تحصيل</button></td>'+
        '<td><button class="del-x" data-del-sale="'+s.id+'">✕</button></td></tr>';
    }).join('') || '<tr><td colspan="8" class="empty">لا توجد مبيعات مسجلة بعد</td></tr>';
    var totalRemaining = totalSold - totalCollected;

    var period = uiState.invCollectionPeriod;
    var periods = [{k:'day',l:'يومي'},{k:'week',l:'أسبوعي'},{k:'month',l:'شهري'},{k:'year',l:'سنوي'}];
    var periodChips = periods.map(function(p){
      return '<div class="period-chip'+(period===p.k?' active':'')+'" data-collection-period="'+p.k+'">'+p.l+'</div>';
    }).join('');
    var collectionsWithDate = collections.map(function(c){ return {entry_date:c.collection_date, amount:c.amount, description:c.description}; });
    var collGroups = groupEntriesByPeriod(collectionsWithDate, period);
    var collGroupsHtml = collGroups.map(function(g){
      var rows = g.items.map(function(c){
        return '<tr><td>'+fmtDate(c.entry_date)+'</td><td>'+escapeHtml(c.description||'—')+'</td><td class="amt credit">+'+money(c.amount)+'</td></tr>';
      }).join('');
      return '<div class="group-block"><div class="group-head"><span>'+escapeHtml(g.label)+'</span><span class="amt credit">'+money(g.total)+'</span></div>'+
        '<table><thead><tr><th>التاريخ</th><th>البيان</th><th>المبلغ</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
    }).join('') || '<div class="empty">لا توجد تحصيلات مسجلة بعد</div>';

    // expense remaining summary
    var expEntries = (cache.entries[pid]||[]).filter(function(e){return e.kind==='expense';});
    var payments = cache.expensePayments[pid] || [];
    var paidByEntry = {};
    payments.forEach(function(p){ paidByEntry[p.entry_id] = (paidByEntry[p.entry_id]||0) + Number(p.amount); });
    var totalExpense=0, totalPaid=0;
    var expRows = expEntries.map(function(e){
      var paid = paidByEntry[e.id]||0;
      var remaining = Number(e.amount)-paid;
      totalExpense += Number(e.amount); totalPaid += paid;
      return '<tr><td>'+fmtDate(e.entry_date)+'</td><td>'+(e.category?escapeHtml(e.category):'—')+'</td>'+
        '<td>'+escapeHtml(e.description||'—')+'</td><td class="amt debit">'+money(e.amount)+'</td>'+
        '<td class="amt credit">'+money(paid)+'</td>'+
        '<td class="amt '+(remaining>0.001?'debit remaining-pos':'remaining-zero')+'">'+money(remaining)+'</td></tr>';
    }).join('') || '<tr><td colspan="6" class="empty">لا توجد مصروفات مسجلة</td></tr>';
    var totalExpRemaining = totalExpense-totalPaid;

    return '<div class="page-head"><h2>المخزون والتحصيل</h2><p>ما تم بيعه وما تبقى من المخزون، وما تم تحصيله من المبيعات وما تبقى، وكذلك المتبقي من المصروفات.</p></div>'+
    '<div class="field" style="max-width:320px;margin-bottom:18px;"><label>المشروع</label><select id="inv-project-select">'+pOptions+'</select></div>'+

    '<div class="panel"><div class="panel-head"><h3>المخزون</h3></div><div class="panel-body" style="padding:0;">'+
      '<table><thead><tr><th>الصنف</th><th>الوحدة</th><th>الكمية بالمخزون</th><th>المباع</th><th>المتبقي</th><th>سعر الوحدة</th><th></th></tr></thead><tbody>'+itemRows+'</tbody></table>'+
    '</div></div>'+
    '<div class="panel"><div class="panel-head"><h3>إضافة صنف جديد للمخزون</h3></div><div class="panel-body">'+
      '<form id="add-item-form"><div class="form-row three">'+
        '<div class="field"><label>اسم الصنف</label><input type="text" id="ni-name" required></div>'+
        '<div class="field"><label>الوحدة</label><input type="text" id="ni-unit" placeholder="قطعة / كرتونة / كجم"></div>'+
        '<div class="field"><label>الكمية الداخلة للمخزون</label><input type="number" id="ni-qty" min="0" step="0.01" required></div>'+
      '</div><div class="field" style="max-width:240px;"><label>سعر بيع الوحدة</label><input type="number" id="ni-price" min="0" step="0.01"></div>'+
      '<button class="btn" type="submit">إضافة الصنف</button></form>'+
    '</div></div>'+

    '<div class="grid-stats">'+
      '<div class="stat"><div class="label">إجمالي قيمة المبيعات</div><div class="val teal">'+money(totalSold)+'</div></div>'+
      '<div class="stat"><div class="label">المحصّل من المبيعات</div><div class="val credit">'+money(totalCollected)+'</div></div>'+
      '<div class="stat"><div class="label">المتبقي تحصيله</div><div class="val '+(totalRemaining>0.001?'debit':'credit')+'">'+money(totalRemaining)+'</div></div>'+
    '</div>'+
    '<div class="panel"><div class="panel-head"><h3>المبيعات</h3></div><div class="panel-body" style="padding:0;overflow-x:auto;">'+
      '<table><thead><tr><th>التاريخ</th><th>الصنف</th><th>الكمية</th><th>قيمة البيع</th><th>المحصّل</th><th>المتبقي</th><th></th><th></th></tr></thead><tbody>'+saleRows+'</tbody></table>'+
    '</div></div>'+
    '<div class="panel"><div class="panel-head"><h3>تسجيل عملية بيع</h3></div><div class="panel-body">'+
      (items.length===0 ? '<div class="empty">أضف صنفًا للمخزون أولاً.</div>' :
      '<form id="add-sale-form"><div class="form-row three">'+
        '<div class="field"><label>الصنف</label><select id="ns-item">'+itemOptions+'</select></div>'+
        '<div class="field"><label>الكمية المباعة</label><input type="number" id="ns-qty" min="0" step="0.01" required></div>'+
        '<div class="field"><label>قيمة البيع الإجمالية</label><input type="number" id="ns-amount" min="0" step="0.01" required></div>'+
      '</div><div class="form-row">'+
        '<div class="field"><label>تاريخ البيع</label><input type="date" id="ns-date" value="'+todayStr()+'" required></div>'+
        '<div class="field"><label>ملاحظات</label><input type="text" id="ns-desc"></div>'+
      '</div><button class="btn" type="submit">تسجيل البيع</button></form>')+
    '</div></div>'+

    '<div class="page-head" style="margin-top:8px;"><h2 style="font-size:18px;">تفصيل التحصيل على الفترات</h2></div>'+
    '<div class="period-toggle">'+periodChips+'</div>'+
    '<div class="panel"><div class="panel-body">'+collGroupsHtml+'</div></div>'+

    '<div class="grid-stats">'+
      '<div class="stat"><div class="label">إجمالي المصروفات</div><div class="val debit">'+money(totalExpense)+'</div></div>'+

    importPanelHtml('import-inv', 'استيراد المخزون من إكسيل', 'اسم الصنف، الوحدة، الكمية، سعر الوحدة');

  async function loadPartnerDashboard(){
    var main = document.getElementById('main-area');
    try{
      cache.meProjects = await api('GET','/me/projects');
      if(!partnerActiveProject && cache.meProjects.length) partnerActiveProject = cache.meProjects[0].id;
      if(cache.meProjects.length===0){
        main.innerHTML = '<div class="page-head"><h2>حسابك</h2></div><div class="panel"><div class="empty">لم يتم ربطك بأي مشروع بعد. تواصل مع المدير المسؤول عن إدخال البيانات.</div></div>';
        return;
      }
      var results = await Promise.all([
        api('GET','/report/'+partnerActiveProject),
        api('GET','/current-account?projectId='+partnerActiveProject),
        api('GET','/entries?projectId='+partnerActiveProject),
        api('GET','/expense-payments?projectId='+partnerActiveProject),
        api('GET','/inventory/items?projectId='+partnerActiveProject),
        api('GET','/inventory/sales?projectId='+partnerActiveProject),
        api('GET','/inventory/collections?projectId='+partnerActiveProject)
      ]);
      var rep = results[0], caEntries = results[1], entries = results[2], expPayments = results[3],
        invItems = results[4], invSales = results[5], invCollections = results[6];
      main.innerHTML = renderPartnerDashboard(rep, caEntries, entries, expPayments, invItems, invSales, invCollections);
      document.querySelectorAll('[data-project]').forEach(function(chip){
        chip.addEventListener('click', function(){ partnerActiveProject = Number(chip.getAttribute('data-project')); loadPartnerDashboard(); });
      });
    }catch(e){
      main.innerHTML = '<div class="panel"><div class="panel-body"><div class="error-box">'+escapeHtml(e.message)+'</div></div></div>';
    }
  }
  function renderPartnerDashboard(rep, caEntries, entries, expPayments, invItems, invSales, invCollections){
    var myShare = rep.partners.find(function(p){ return p.partnerId === currentUser.partnerId; }) || {};
    var projectName = cache.meProjects.find(function(p){return p.id===partnerActiveProject;}).name;
    var chips = cache.meProjects.map(function(p){
      return '<div class="chip'+(p.id===partnerActiveProject?' active':'')+'" data-project="'+p.id+'">'+escapeHtml(p.name)+'</div>';
    }).join('');

    var kindLabel = {deposit:'إيداع', withdrawal:'سحب', distribution:'توزيع أرباح'};
    var kindTag = {deposit:'dep', withdrawal:'wd', distribution:'dist'};
    var caRows = caEntries.map(function(c){
      var isCredit = c.kind!=='withdrawal';
      return '<tr><td>'+fmtDate(c.entry_date)+'</td><td><span class="tag '+kindTag[c.kind]+'">'+kindLabel[c.kind]+'</span></td>'+
        '<td>'+escapeHtml(c.description||'—')+'</td>'+
        '<td class="amt '+(isCredit?'credit':'debit')+'">'+(isCredit?'+':'-')+money(c.amount)+'</td></tr>';
    }).join('') || '<tr><td colspan="4" class="empty">لا توجد حركات على حسابك الجاري بعد</td></tr>';

    var entriesRows = entries.map(function(e){
      return '<tr><td>'+fmtDate(e.entry_date)+'</td><td><span class="tag '+(e.kind==='revenue'?'rev':'exp')+'">'+(e.kind==='revenue'?'إيراد':'مصروف')+'</span></td>'+
        '<td>'+escapeHtml(e.description||'—')+(e.category?(' <span class="tag cat">'+escapeHtml(e.category)+'</span>'):'')+'</td>'+
        '<td class="amt '+(e.kind==='revenue'?'credit':'debit')+'">'+(e.kind==='revenue'?'+':'-')+money(e.amount)+'</td></tr>';
    }).join('') || '<tr><td colspan="4" class="empty">لا توجد حركات على هذا المشروع بعد</td></tr>';

    // Inventory summary (read-only)
    var soldByItem = {}; invSales.forEach(function(s){ soldByItem[s.item_id]=(soldByItem[s.item_id]||0)+Number(s.quantity); });
    var collectedBySale = {}; invCollections.forEach(function(c){ collectedBySale[c.sale_id]=(collectedBySale[c.sale_id]||0)+Number(c.amount); });
    var invRows = invItems.map(function(it){
      var sold = soldByItem[it.id]||0;
      var remainingQty = Number(it.quantity_in)-sold;
      return '<tr><td>'+escapeHtml(it.name)+'</td><td>'+escapeHtml(it.unit||'—')+'</td>'+
        '<td class="mono">'+it.quantity_in+'</td><td class="mono">'+sold+'</td><td class="mono">'+remainingQty+'</td></tr>';
    }).join('') || '<tr><td colspan="5" class="empty">لا يوجد مخزون مسجل لهذا المشروع</td></tr>';
    var totalSold=0, totalCollected=0;
    invSales.forEach(function(s){ totalSold += Number(s.sale_amount); totalCollected += collectedBySale[s.id]||0; });
    var totalRemainingCollection = totalSold-totalCollected;

    // Expense remaining summary (read-only)
    var paidByEntry = {}; expPayments.forEach(function(p){ paidByEntry[p.entry_id]=(paidByEntry[p.entry_id]||0)+Number(p.amount); });
    var expEntries = entries.filter(function(e){return e.kind==='expense';});
    var totalExpense=0, totalPaid=0;
    expEntries.forEach(function(e){ totalExpense+=Number(e.amount); totalPaid += paidByEntry[e.id]||0; });
    var totalExpRemaining = totalExpense-totalPaid;

    return '<div class="page-head"><h2>حسابك</h2><p>البيانات محدّثة مباشرة من قاعدة البيانات المركزية.</p></div>'+
    (cache.meProjects.length>1 ? '<div class="select-projects">'+chips+'</div>' : '')+
    '<div class="balance-banner"><div><div class="l">رصيد حسابك الجاري في «'+escapeHtml(projectName)+'»</div>'+
      '<div class="v">'+money(myShare.currentAccountBalance||0)+'</div></div>'+
      '<div class="pct">نسبتك في المشروع: '+(myShare.percentage||0)+'%</div></div>'+
    '<div class="grid-stats">'+
      '<div class="stat"><div class="label">إجمالي إيرادات المشروع</div><div class="val credit">'+money(rep.revenue)+'</div></div>'+
      '<div class="stat"><div class="label">إجمالي مصروفات المشروع</div><div class="val debit">'+money(rep.expense)+'</div></div>'+
      '<div class="stat"><div class="label">صافي ربح المشروع</div><div class="val '+(rep.net>=0?'credit':'debit')+'">'+money(rep.net)+'</div></div>'+
      '<div class="stat"><div class="label">نصيبك من صافي الربح</div><div class="val teal">'+money(myShare.shareOfNet||0)+'</div></div>'+
    '</div>'+
    '<div class="panel"><div class="panel-head"><h3>حركات حسابك الجاري</h3></div><div class="panel-body" style="padding:0;">'+
      '<table><thead><tr><th>التاريخ</th><th>النوع</th><th>البيان</th><th>المبلغ</th></tr></thead><tbody>'+caRows+'</tbody></table>'+
    '</div></div>'+
    '<div class="panel"><div class="panel-head"><h3>حساب المشروع بالكامل</h3></div><div class="panel-body" style="padding:0;">'+
      '<table><thead><tr><th>التاريخ</th><th>النوع</th><th>البيان</th><th>المبلغ</th></tr></thead><tbody>'+entriesRows+'</tbody></table>'+
    '</div></div>'+
    '<div class="panel"><div class="panel-head"><h3>المخزون</h3></div><div class="panel-body" style="padding:0;">'+
      '<table><thead><tr><th>الصنف</th><th>الوحدة</th><th>الداخل للمخزون</th><th>المباع</th><th>المتبقي</th></tr></thead><tbody>'+invRows+'</tbody></table>'+
    '</div></div>'+
    '<div class="grid-stats">'+
      '<div class="stat"><div class="label">إجمالي قيمة المبيعات</div><div class="val teal">'+money(totalSold)+'</div></div>'+
      '<div class="stat"><div class="label">المحصّل من المبيعات</div><div class="val credit">'+money(totalCollected)+'</div></div>'+
      '<div class="stat"><div class="label">المتبقي تحصيله</div><div class="val '+(totalRemainingCollection>0.001?'debit':'credit')+'">'+money(totalRemainingCollection)+'</div></div>'+
      '<div class="stat"><div class="label">المتبقي من المصروفات</div><div class="val '+(totalExpRemaining>0.001?'debit':'credit')+'">'+money(totalExpRemaining)+'</div></div>'+
    '</div>';
  }

  render();
})();
</script>
</body>
</html>
